    <text x="82" y="282" fill="#e9d5ff" font-size="27" font-weight="500">Onboarding tours &amp; coach marks</text>
    <text x="82" y="318" fill="#e9d5ff" font-size="27" font-weight="500">for Jetpack Compose, in one modifier</text>
    <text x="82" y="380" fill="#c4b5fd" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">Modifier.spotlightTarget(state, "search", order = 1, …)</text>

    <g filter="url(#shadow)">
      <rect x="820" y="70" width="320" height="440" rx="36" fill="#faf5ff"/>
      <text x="850" y="134" fill="#1f2937" font-size="24" font-weight="700">Notes</text>
      <circle cx="1078" cy="126" r="14" fill="none" stroke="#1f2937" stroke-width="3"/>
      <rect x="850" y="170" width="80" height="30" rx="10" fill="#ede9fe"/>
      <g fill="#ffffff" stroke="#e9d5ff">
        <rect x="850" y="216" width="260" height="70" rx="16"/>
        <rect x="850" y="298" width="260" height="70" rx="16"/>
        <rect x="850" y="380" width="260" height="70" rx="16"/>
      </g>
      <rect x="820" y="70" width="320" height="440" rx="36" fill="#000" fill-opacity="0.68" mask="url(#hole)"/>
      <circle cx="1078" cy="126" r="30" fill="none" stroke="#c084fc" stroke-width="2"/>
      <circle cx="1078" cy="126" r="40" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4"/>
      <circle cx="1078" cy="126" r="14" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M1088 136 l8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

