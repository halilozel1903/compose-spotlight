      <text x="870" y="206" fill="#7c3aed" font-size="15" font-weight="700">1 / 4</text>
      <text x="870" y="234" fill="#111827" font-size="20" font-weight="700">Search everything</text>
      <text x="870" y="260" fill="#4b5563" font-size="15">Find notes, tags and checklists.</text>
      <circle cx="874" cy="298" r="4.5" fill="#7c3aed"/>
