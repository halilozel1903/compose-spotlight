<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-spotlight: onboarding tours and coach marks for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1036"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <mask id="hole">
      <rect x="820" y="70" width="320" height="440" rx="36" fill="#fff"/>
      <circle cx="1078" cy="126" r="30" fill="#000"/>
